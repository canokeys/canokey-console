[package]
name = "rust_lib_canokey_console"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
aes = "^0.9.3"
const-oid = "^0.10.1"
der = { version = "^0.8.1", features = ["derive", "pem"] }
des = "^0.9.0"
ed25519-dalek = { version = "^3.0.0", default-features = false, features = ["fast", "pem", "pkcs8"] }
flutter_rust_bridge = "=2.13.0"
hex-literal = "^1.1.0"
image = { version = "^0.25.8", default-features = false, features = ["png"] }
k256 = { version = "^0.14.0", default-features = false, features = ["ecdsa", "pem", "pkcs8", "std"] }
log = "^0.4.34"
once_cell = "^1.21.4"
p256 = { version = "^0.14.0", default-features = false, features = ["ecdsa", "pem", "pkcs8", "std"] }
p384 = { version = "^0.14.0", default-features = false, features = ["ecdsa", "pem", "pkcs8", "std"] }
p521 = { version = "^0.14.0", default-features = false, features = ["ecdsa", "pem", "pkcs8", "std"] }
pbkdf2 = { version = "^0.13.0", features = ["hmac"] }
rsa = { version = "^0.9.10", default-features = false, features = ["pem", "sha2", "std", "u64_digit"] }
rxing = { version = "^0.9.2", features = ["client_support", "decoders", "encoding_rs", "image", "qrcode", "wasm_support"], default-features = false }
sha1 = "^0.11.0"
sha2 = "^0.11.0"
sha2_legacy = { package = "sha2", version = "^0.10.9" }
sm2 = { version = "^0.13.3", default-features = false, features = ["dsa", "pem", "pkcs8", "std"] }
sm3 = "^0.5.0"
x509-cert = "^0.3.0"
x509-parser = "^0.18.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "^0.4.3", features = ["wasm_js"] }

[dev-dependencies]
rand = "^0.10.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
