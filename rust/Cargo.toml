[package]
name = "rust_lib_canokey_console"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
aes = "^0.8.4"
der = { version = "^0.7.10", features = ["derive"] }
des = "^0.9.0"
ed25519-dalek = { version = "^2.2.0", default-features = false, features = ["fast", "std"] }
flutter_rust_bridge = "=2.12.0"
hex-literal = "^0.4.1"
image = { version = "^0.25.8", default-features = false, features = ["png"] }
k256 = { version = "^0.13.4", default-features = false, features = ["ecdsa", "std"] }
log = "^0.4.29"
once_cell = "^1.21.4"
p256 = { version = "^0.13.2", default-features = false, features = ["ecdsa", "std"] }
p384 = { version = "^0.13.1", default-features = false, features = ["ecdsa", "std"] }
p521 = { version = "^0.13.3", default-features = false, features = ["ecdsa", "std"] }
pbkdf2 = { version = "^0.13.0", features = ["hmac"] }
rsa = { version = "^0.9.8", default-features = false, features = ["sha2", "std", "u64_digit"] }
rxing = { version = "^0.9.0", features = ["client_support", "decoders", "encoding_rs", "image", "qrcode", "wasm_support"], default-features = false }
sha1 = "^0.11.0"
sha2 = "^0.10.9"
sm2 = { version = "^0.13.3", default-features = false, features = ["dsa", "std"] }
sm3 = "^0.4.2"
x509-parser = "^0.18.1"

[dev-dependencies]
rand = "^0.8.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
