name: Deploy Web App

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: 3.47.1
  RUST_NIGHTLY: nightly-2026-09-04

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Resolve latest wasm-pack version
      id: wasm_pack
      run: |
        version="$(curl --fail --silent --show-error \
          --user-agent 'canokey-console-ci (https://github.com/canokeys/canokey-console)' \
          https://crates.io/api/v1/crates/wasm-pack | jq -er '.crate.max_stable_version')"
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ env.RUST_NIGHTLY }}
        components: rust-src
        target: wasm32-unknown-unknown
        rust-src-dir: rust
        cache-key: web-wasm-pack-${{ steps.wasm_pack.outputs.version }}
        cache-directories: ~/.cache/.wasm-pack
    - name: Setup Flutter SDK
      uses: flutter-actions/setup-flutter@v4
      with:
        channel: stable
        version: ${{ env.FLUTTER_VERSION }}
        cache: true
    - run: flutter pub get
    - name: Build Rust Library
      env:
        WASM_PACK_VERSION: ${{ steps.wasm_pack.outputs.version }}
      run: |
        cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
        cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked
        flutter_rust_bridge_codegen build-web --release \
          --wasm-pack-rustup-toolchain "$RUST_NIGHTLY"
    - run: flutter build web --verbose
    - uses: actions/upload-artifact@v7
      with:
        name: web-spa
        path: build/web/
  deploy-cfpages:
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: web-spa
          path: /tmp/console-build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy /tmp/console-build
            --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }}
            --branch=${{ github.head_ref || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  deploy-edgeone:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: web-spa
          path: /tmp/console-build
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
      - name: Install EdgeOne CLI
        run: npm install -g edgeone
      - name: Deploy to EdgeOne
        run: edgeone pages deploy /tmp/console-build -n ${{ vars.EDGEONE_PROJECT_NAME }} -t ${{ secrets.EDGEONE_API_TOKEN }}
        timeout-minutes: 10
