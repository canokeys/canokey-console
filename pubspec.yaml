name: canokey_console
description: Manage your CanoKey via NFC or USB.
publish_to: 'none'

version: 1.2.7+21

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.47.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get: ^4.6.6
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  google_fonts: ^8.1.0
  lucide_icons_flutter: ^3.1.18
  url_launcher: ^6.3.1
  file_picker: ^12.2.0
  intl: ^0.20.2
  flutter_nfc_kit: ^3.6.0
  base32: ^2.1.3
  convert: ^3.1.2
  percent_indicator: ^4.2.4
  timer_controller: ^1.0.0
  loader_overlay: ^5.0.0
  flutter_spinkit: ^5.2.1
  fixnum: ^1.1.1
  platform_detector: ^0.2.0
  mobile_scanner: ^7.1.3
  ndef: ^0.4.0
  flutter_webrtc: ^1.6.1
  ccid: ^0.1.9
  device_info_plus: ^13.1.0
  file_saver: ^0.4.0
  rust_lib_canokey_console:
    path: rust_builder
  flutter_rust_bridge: 2.13.0
  logger: ^2.5.0
  package_info_plus: ^10.1.0
  chinese_font_library: ^1.2.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: CanoKey Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway-ExtraBold.ttf
          weight: 800
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: ABeeZee
      fonts:
        - asset: assets/fonts/ABeeZee-Regular.ttf
          weight: 400
    - family: Abel
      fonts:
        - asset: assets/fonts/Abel-Regular.ttf
          weight: 400
    - family: CanoKey CJK
      fonts:
        - asset: assets/fonts/CanoKeyCJK-Regular.ttf
          weight: 400
        - asset: assets/fonts/CanoKeyCJK-Bold.ttf
          weight: 700
  assets:
    - assets/fonts/IBMPlexMono-OFL.txt
    - assets/fonts/GoogleFonts-OFL.txt
    - assets/fonts/NotoSansSC-OFL.txt
    - assets/images/logo/
    - assets/images/oath/
    - rust/THIRD_PARTY_LICENSES.json

flutter_intl:
  enabled: true
